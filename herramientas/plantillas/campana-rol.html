    <!-- ==== TEMA ==== -->
    <meta name="theme-color" content="#12091c">
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var temas = {
            "claro": ["light", "#f3e1d6"],
            "oscuro-puro": ["puro-oscuro", "#000000"],
            "claro-puro": ["puro-claro", "#ffffff"],
            "tranquilo": ["tranquilo", "#f2efe9"],
            "tranquilo-oscuro": ["tranquilo-oscuro", "#1b1e22"],
            "terminal-verde": ["terminal-verde", "#000000"],
            "terminal-azul": ["terminal-azul", "#000000"],
            "terminal-rojo": ["terminal-rojo", "#000000"],
            "terminal-ambar": ["terminal-ambar", "#000000"]
          };
          var guardado = localStorage.getItem("richi-theme");
          var elegido = temas[guardado];
          if (!elegido && !guardado &&
              window.matchMedia("(prefers-color-scheme: light)").matches) {
            elegido = temas.claro;
          }
          if (elegido) {
            document.documentElement.setAttribute("data-theme", elegido[0]);
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) { barra.setAttribute("content", elegido[1]); }
          }
          if (localStorage.getItem("richi-lateral") === "plegada") {
            document.documentElement.classList.add("lateral-plegada");
          }
        } catch (e) {}
      })();
    </script>

<body>
    <!-- ==== SIDEBAR / NAVEGACIÓN ==== -->
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="sidebar-container"></div>
    <!-- ==== CONTENIDO PRINCIPAL ==== -->

    <main id="main-content">
        <!-- ==== HOME ==== -->
        <section id="home" class="home campana-page">
            <!-- LA PÁGINA DE UNA CAMPAÑA
                 Dos cosas: la ficha (qué se juega, con quién y de qué va)
                 y el índice de sesiones. Las dos las pinta
                 scripts/paginas/notas-rol.js con lo que haya en el JSON
                 que dice data-campana-datos, aquí abajo.

                 PARA UNA CAMPAÑA NUEVA no hay que tocar ni este archivo
                 ni el script: se copia esta carpeta, se cambia ese
                 atributo (y los textos del <head>), se crea su JSON
                 copiando datos/notas_rol/campana-ragna.json y se añade su enlace
                 al menú, en fragmentos/barra-lateral.html. -->
            <div class="campana-titulo">
                <a class="campana-volver" href="/index.html">← volver al inicio</a>
                <h1 class="home-title">
                    <em>notas de rol</em>
                </h1>
                <!-- El nombre de la campaña, debajo del título, igual que
                     el año en el archivo del blog: juntos se leen
                     "notas de rol — campaña de Ragna". -->
                <p class="campana-nombre" data-campana-nombre>{{CAMPANA_NOMBRE}}</p>
            </div>

            <div class="campana-cabecera">
                <p class="campana-intro" data-campana-intro>{{INTRO}}</p>

                <!-- LOS BOTONES DE LA CAMPAÑA.
                     El primero lleva a otra página; el del botín abre una
                     ventana encima de ésta, y por eso es <button> y no un
                     enlace: lo que distingue una cosa de la otra es si vas
                     a cambiar de pantalla o no, y el teclado y un lector
                     de pantalla lo anuncian distinto
                     (aria-haspopup="dialog").

                     Los de la ventana NO se escriben con su texto
                     aquí: los enciende scripts/paginas/notas-rol.js solo
                     si la campaña tiene algo dentro. Una campaña recién
                     empezada no enseña botones que abren ventanas
                     vacías.

                     YA NO HAY BOTÓN DE «LA MESA»: la ventana sigue
                     estando, pero se abre pulsando el token de cada
                     personaje en la ficha de aquí abajo, que es donde se
                     le busca. -->
                <p class="campana-botones">
                    <a class="campana-boton" data-campana-npcs href="{{PERSONAJES_URL}}">npcs →</a>
                    <button class="campana-boton" type="button"
                            data-campana-botin-abrir aria-haspopup="dialog" hidden>el botín →</button>
                    <button class="campana-boton" type="button"
                            data-campana-misiones-abrir aria-haspopup="dialog" hidden>pendientes →</button>
                </p>
            </div>

            <!-- LA FICHA DE LA CAMPAÑA
                 Sistema, quién dirige, los personajes y de qué va. Lo que
                 esté en blanco en el JSON no sale: una ficha a medias es
                 mejor que una ficha con huecos. -->
            <div class="campana-ficha" data-campana-ficha hidden>
                <div class="recent-entries-header">
                    <h2>campana.nfo</h2>
                    <div class="window-controls window-controls-small" data-window-controls aria-hidden="true"></div>
                </div>
                <div class="campana-ficha-cuerpo" data-campana-ficha-cuerpo></div>
            </div>

            <!-- EL ÍNDICE DE SESIONES -->
            <div class="campana-card">
                <div class="recent-entries-header">
                    <h2>sesiones.lst</h2>
                    <div class="window-controls window-controls-small" data-window-controls aria-hidden="true"></div>
                </div>
                <div class="campana-card-body" tabindex="0" role="region" aria-label="Sesiones de la campaña, con scroll">
                    <ol class="campana-sesiones" data-campana-sesiones data-campana-datos="{{JSON}}">
                        <li class="entries-loading">Cargando las sesiones…</li>
                    </ol>
                </div>
            </div>

            <!-- El mismo botón abajo: cuando la lista de sesiones crece,
                 al llegar al final el de arriba se ha quedado lejos. -->
            <a class="campana-volver campana-volver-abajo" href="/index.html">← volver al inicio</a>
        </section>
    </main>
