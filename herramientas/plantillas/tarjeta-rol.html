                <div class="portfolio-card" data-categoria="{{CATEGORIA}}" data-fecha="{{FECHA}}">
                    <img class="portfolio-card-photo" src="{{IMAGEN}}" alt="{{ALT}}" loading="lazy">
                    <div class="portfolio-card-info">
                        <!-- h2 y no h3: sin encabezados de categoría, los
                             títulos saltaban de h1 a h3. -->
                        <h2 class="portfolio-card-title">{{TITULO}}</h2>
                        <p class="portfolio-card-system">{{SISTEMA}}</p>
                        <p class="portfolio-card-desc">{{DESCRIPCION}}</p>
                        <!-- El texto escondido va dentro del enlace a
                             propósito: a la vista pone solo "Ver en Ko-fi",
                             pero quien usa lector de pantalla saca la lista de
                             enlaces de la página y oiría "Ver en Ko-fi" tres o
                             cuatro veces seguidas sin saber de qué aventura es
                             cada uno. Y de paso avisa de que se abre en otra
                             pestaña. -->
                        <div class="portfolio-card-actions">
                            <a class="portfolio-card-btn" href="{{KOFI}}" target="_blank" rel="noopener noreferrer">Ver en Ko-fi →<span class="visually-hidden"> — {{TITULO}} (se abre en otra pestaña)</span></a>
{{DRIVE}}
                        </div>
                    </div>
                </div>
