<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <!-- ==== TEMA ====
         El tema elegido, puesto antes del primer pintado para que no haya
         fogonazo. Lo escribe la herramienta leyendo scripts/tema.js. -->
    <meta name="theme-color" content="#12091c">
    <script>
      (function () {
        // Una marca de que el JavaScript funciona, puesta ANTES del primer
        // pintado. Sirve para que una hoja de estilo pueda decir "esto
        // solo si hay JavaScript": un spoiler tapado, por ejemplo, que sin
        // JavaScript sería texto perdido y con él se destapa al pulsarlo.
        // Aquí y no en otro sitio porque es el único script que corre
        // antes de pintar: puesto más tarde habría fogonazo.
        document.documentElement.classList.add("js");
        try {
          var temas = {
            "claro": ["light", "#f3e1d6"],
            "oscuro-puro": ["puro-oscuro", "#000000"],
            "claro-puro": ["puro-claro", "#ffffff"],
            "tranquilo": ["tranquilo", "#f2efe9"],
            "tranquilo-oscuro": ["tranquilo-oscuro", "#1b1e22"],
            "terminal-verde": ["terminal-verde", "#000000"],
            "terminal-azul": ["terminal-azul", "#000000"],
            "terminal-rojo": ["terminal-rojo", "#000000"],
            "terminal-ambar": ["terminal-ambar", "#000000"]
          };
          var guardado = localStorage.getItem("richi-theme");
          var elegido = temas[guardado];
          if (!elegido && !guardado &&
              window.matchMedia("(prefers-color-scheme: light)").matches) {
            elegido = temas.claro;
          }
          if (elegido) {
            document.documentElement.setAttribute("data-theme", elegido[0]);
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) { barra.setAttribute("content", elegido[1]); }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITULO}} · Relatos · El Blog de Richi</title>
    <!-- Cómo se ve el enlace al compartirlo (Bluesky, Discord, Ko-fi…).
         Sin esto solo sale la URL pelada, sin título ni imagen. Las rutas
         van absolutas a propósito: las redes no resuelven las relativas. -->
    <meta name="description" content="{{DESCRIPCION}}">
    <link rel="canonical" href="https://richi.blog{{URL}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="El Blog de Richi">
    <meta property="og:locale" content="es_ES">
    <meta property="og:title" content="{{TITULO}} · Relatos · El Blog de Richi">
    <meta property="og:description" content="{{DESCRIPCION}}">
    <meta property="og:url" content="https://richi.blog{{URL}}">
    <meta property="og:image" content="https://richi.blog/imagenes/meta/og.webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="El Blog de Richi — ilustración de Richi sobre fondo morado">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
    <!-- La única fuente que se precarga. Medido con la red frenada: sin esto el
         navegador no la descubre hasta parsear el CSS (~800 ms) y el texto baila al
         cambiar de tipografía; así llega antes del primer pintado y no se nota el
         cambio. Precargar más fuentes empeoraba el primer pintado 150-210 ms, porque
         compiten por el ancho de banda con lo que hace falta para pintar. -->
    <link rel="preload" href="/tipografias/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="El Blog de Richi — blog, relatos y rol" href="/blog/rss.xml">
    <!-- ==== ADELANTO DEL MENÚ ====
         El menú, pedido LO PRIMERO para que no llegue tarde. Lo escribe
         la herramienta; el porqué está en ella. -->
    <script>window.adelantoDeFragmentos={};try{window.adelantoDeFragmentos["/fragmentos/barra-lateral.html"]=fetch("/fragmentos/barra-lateral.html?v=739425f1").then(function(r){return r.ok?r.text():null}).catch(function(){return null})}catch(e){}</script>
    <!-- ==== CSS ====

         No la toques a mano (el porqué, en esa herramienta). -->

    <link rel="stylesheet" href="/estilos/componentes/texto-entrada.css?v=3b361f52">
    <link rel="stylesheet" href="/estilos/componentes/lectura.css?v=264f4348">
    <link rel="stylesheet" href="/estilos/paginas/relatos.css?v=cf99bed4">

    <link rel="stylesheet" href="/estilos/componentes/barra-lateral.css?v=e510b648">

    <link rel="stylesheet" href="/estilos/paginas/buscar.css?v=692b762d">
    <link rel="stylesheet" href="/estilos/paquete-cierre.css?v=7d910eba">
    <!-- ==== fin del CSS ==== -->

    <!-- ==== JS ====
         Igual que el CSS: la escribe la herramienta, a partir de

    <script defer src="/scripts/componentes/lectura.js?v=765a2a01"></script>
    <script defer src="/scripts/componentes/leer-en-voz.js?v=52fa79a5"></script>

  </head>
<body>
    <!-- ==== SIDEBAR / NAVEGACIÓN ==== -->
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="sidebar-container"></div>
    <!-- ==== CONTENIDO PRINCIPAL ==== -->

    <main id="main-content">
        <!-- ==== HOME ==== -->
        <section id="home" class="home relato-page">
            <!-- data-subcategoria: lo que sale debajo del título en los
                 listados ("microrelato"). Va aquí y no solo en
                 datos/mis-movidas.json para que
                 herramientas/3-generadores/generar-posts.py pueda reconstruir el JSON
                 leyendo las páginas. -->
            <!-- data-borrador: mientras esté puesto, este relato NO sale
                 en los listados, ni en el RSS, ni en el sitemap, y arriba
                 se ve una franja avisando. Todo relato nuevo nace así,
                 para que uno a medio escribir no se publique solo al
                 subir el sitio. Para publicarlo:

                     python3 herramientas/1-publicar/publicar.py

                 (que es lo mismo que borrar "data-borrador" de la línea
                 de abajo y volver a pasar los generadores). -->
            <article class="relato-post" data-borrador data-subcategoria="{{SUBCATEGORIA}}">
                <div class="relato-post-header">
                    <h1 class="relato-post-title">{{TITULO}}</h1>
                    <div class="relato-post-header-meta">
                        <p class="relato-post-date"><time datetime="{{FECHA_ISO}}">{{FECHA}}</time></p>
                        <a class="relato-post-back" href="/web/mis_movidas/relatos/index_relatos.html">← volver a relatos</a>
                    </div>
                </div>

                <div class="relato-post-body-wrap">
                    <div class="relato-post-layout">
                        <div class="relato-post-body">
                            <p>{{CUERPO}}</p>
                        </div>

                        <!-- Columna de la derecha: la imagen y "sigue leyendo". Va pegada
                             arriba mientras se desplaza el texto (ver .relato-post-side). -->
                        <div class="relato-post-side">
                            <!-- IMAGEN DEL RELATO
                                 La pone nuevo.py si le dices una al
                                 crear el relato; si no, aquí no hay nada.
                                 Para añadirla después, copia este bloque:

                                 <figure class="relato-post-aside">
                                     <img src="/imagenes/blog/loquesea.webp" alt="" width="780" height="1170" loading="lazy" decoding="async">
                                     <figcaption>un pie para la imagen</figcaption>
                                 </figure> -->
{{IMAGEN}}

                            <div class="relato-post-otras" data-otras-caja>
                                <div class="recent-entries-header">
                                    <h2>otros_relatos.txt</h2>
                                    <div class="window-controls window-controls-small" data-window-controls aria-hidden="true"></div>
                                </div>
                                <ul class="entries-list" data-otras-entradas="relatos">
                                    <li class="entries-loading">Cargando…</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
