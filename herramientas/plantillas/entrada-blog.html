<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-aDtzI6QgHfitL7afCewTh/rpYprDOJvupEIYVZKPk8Y='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <!-- ==== TEMA ==== -->
    <meta name="theme-color" content="#12091c">
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var temas = {
            "claro": ["light", "#f3e1d6"],
            "oscuro-puro": ["puro-oscuro", "#000000"],
            "claro-puro": ["puro-claro", "#ffffff"],
            "tranquilo": ["tranquilo", "#f2efe9"],
            "tranquilo-oscuro": ["tranquilo-oscuro", "#1b1e22"],
            "terminal-verde": ["terminal-verde", "#000000"],
            "terminal-azul": ["terminal-azul", "#000000"],
            "terminal-rojo": ["terminal-rojo", "#000000"],
            "terminal-ambar": ["terminal-ambar", "#000000"]
          };
          var guardado = localStorage.getItem("richi-theme");
          var elegido = temas[guardado];
          if (!elegido && !guardado &&
              window.matchMedia("(prefers-color-scheme: light)").matches) {
            elegido = temas.claro;
          }
          if (elegido) {
            document.documentElement.setAttribute("data-theme", elegido[0]);
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) { barra.setAttribute("content", elegido[1]); }
          }
          if (localStorage.getItem("richi-lateral") === "plegada") {
            document.documentElement.classList.add("lateral-plegada");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITULO}} · El Blog de Richi</title>
    <!-- Cómo se ve el enlace al compartirlo (Bluesky, Discord, Ko-fi…).
         Sin esto solo sale la URL pelada, sin título ni imagen. Las rutas
         van absolutas a propósito: las redes no resuelven las relativas. -->
    <meta name="description" content="{{DESCRIPCION}}">
    <link rel="canonical" href="https://richi.blog{{URL}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="El Blog de Richi">
    <meta property="og:locale" content="es_ES">
    <meta property="og:title" content="{{TITULO}} · El Blog de Richi">
    <meta property="og:description" content="{{DESCRIPCION}}">
    <meta property="og:url" content="https://richi.blog{{URL}}">
    <meta property="og:image" content="https://richi.blog/imagenes/meta/og.webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="El Blog de Richi — ilustración de Richi sobre fondo morado">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
    <!-- La única fuente que se precarga. Medido con la red frenada: sin esto el
         navegador no la descubre hasta parsear el CSS (~800 ms) y el texto baila al
         cambiar de tipografía; así llega antes del primer pintado y no se nota el
         cambio. Precargar más fuentes empeoraba el primer pintado 150-210 ms, porque
         compiten por el ancho de banda con lo que hace falta para pintar. -->
    <link rel="preload" href="/tipografias/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="El Blog de Richi — blog, relatos y rol" href="/blog/rss.xml">
    <!-- ==== CSS ==== -->
    <link rel="stylesheet" href="/estilos/paquete-comun.css?v=42e63d33">
    <link rel="stylesheet" href="/ligero/estilos/componentes/texto-entrada.css?v=47c67664">
    <link rel="stylesheet" href="/ligero/estilos/componentes/lectura.css?v=9dd57c8f">
    <link rel="stylesheet" href="/ligero/estilos/paginas/blog.css?v=16a76900">
    <link rel="stylesheet" href="/ligero/estilos/paginas/blog.responsive.css?v=107014cc">
    <link rel="stylesheet" href="/estilos/paquete-cierre.css?v=a49d87f4">
    <!-- ==== fin del CSS ==== -->
    <script src="/ligero/scripts/cargador-scripts.js?v=cee4ebcb"></script>
    <!-- ==== JS ==== -->
    <script defer src="/scripts/paquete-comun.js?v=5806fd68"></script>
    <script defer src="/ligero/scripts/componentes/lectura.js?v=a3a30b01"></script>
    <script defer src="/ligero/scripts/componentes/leer-en-voz.js?v=0991ea31"></script>
    <script defer src="/ligero/scripts/paginas/otras-entradas.js?v=7dcd6e8b"></script>
    <!-- ==== fin del JS ==== -->
  </head>
<body>
    <!-- ==== SIDEBAR / NAVEGACIÓN ==== -->
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="sidebar-container"></div>
    <!-- ==== CONTENIDO PRINCIPAL ==== -->

    <main id="main-content">
        <!-- ==== HOME ==== -->
        <section id="home" class="home blog-post-page">
            <!-- data-tags: las etiquetas de la entrada. Van aquí y no solo en
                 datos/blog/entradas-blog.json para que herramientas/3-generadores/generar-posts.py
                 pueda reconstruir el JSON leyendo las páginas: así la
                 página es la fuente de la verdad y el JSON no se puede
                 quedar desincronizado. Separadas por espacios. -->
            <!-- data-borrador: mientras esté puesto, esta entrada NO sale
                 en los listados, ni en el RSS, ni en el sitemap, y arriba
                 se ve una franja avisando. Toda entrada nueva nace así,
                 para que una a medio escribir no se publique sola al
                 subir el sitio. Para publicarla:

                     python3 herramientas/1-publicar/publicar.py

                 (que es lo mismo que borrar "data-borrador" de la línea
                 de abajo y volver a pasar los generadores). -->
            <article class="blog-post" data-borrador data-tags="{{TAGS}}">
                <div class="blog-post-header">
                    <h1 class="blog-post-title">{{TITULO}}</h1>
                    <div class="blog-post-header-meta">
                        <p class="blog-post-date"><time datetime="{{FECHA_ISO}}">{{FECHA}}</time></p>
                        <a class="blog-post-back" href="/web/blog/{{ANYO}}/index_{{ANYO}}.html">← volver al archivo</a>
                        <!-- Atajo al diario en calendario. El icono va
                             dibujado en SVG y no con un emoji o un glifo:
                             un carácter lo pinta la fuente que tenga quien
                             visita la web, y si no es la misma sale
                             descentrado sin que se pueda arreglar desde el
                             CSS (pasó con el botón de recargar del gatín).
                             Toma el color del botón con currentColor. -->
                        <a class="blog-post-back blog-post-cal" href="/web/blog/diario.html">
                            <svg class="blog-post-cal-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <rect x="3" y="5" width="18" height="16" rx="1" fill="none"
                                      stroke="currentColor" stroke-width="2"/>
                                <path d="M3 10H21" fill="none" stroke="currentColor" stroke-width="2"/>
                                <path d="M8 2.5V6M16 2.5V6" fill="none" stroke="currentColor"
                                      stroke-width="2" stroke-linecap="round"/>
                                <rect x="10.5" y="13.5" width="3.5" height="3.5" fill="currentColor"/>
                            </svg>
                            calendario
                        </a>
                    </div>
                </div>

                <div class="blog-post-body-wrap">
                    <div class="blog-post-layout">
                        <div class="blog-post-body">
                            <p>{{CUERPO}}</p>
                        </div>

                        <!-- Columna de la derecha: la imagen y "sigue leyendo". Va pegada
                             arriba mientras se desplaza el texto (ver .blog-post-side). -->
                        <div class="blog-post-side">
                            <!-- IMAGEN DE LA ENTRADA
                                 La pone nuevo.py si le dices una al
                                 crear la entrada; si no, aquí no hay nada y la
                                 columna se queda solo con "sigue leyendo".
                                 Para añadirla después: guárdala en
                                 /imagenes/blog/, pásala por
                                 optimizar-imagenes.py y copia este bloque:

                                 <figure class="blog-post-aside">
                                     <img src="/imagenes/blog/loquesea.webp" alt="" width="780" height="1170" loading="lazy" decoding="async">
                                     <figcaption>un pie para la imagen</figcaption>
                                 </figure>

                                 El alt vacío es para una imagen de adorno: así
                                 un lector de pantalla no la nombra. Si la
                                 imagen aporta algo al texto, escríbele un alt
                                 de verdad. width y height son los del archivo,
                                 para que el navegador reserve el hueco y el
                                 texto no salte al cargar. -->
{{IMAGEN}}
                            <div class="blog-post-otras" data-otras-caja>
                                <div class="recent-entries-header">
                                    <h2>otras_entradas.txt</h2>
                                    <div class="window-controls window-controls-small" data-window-controls aria-hidden="true"></div>
                                </div>
                                <ul class="entries-list" data-otras-entradas="blog">
                                    <li class="entries-loading">Cargando…</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
